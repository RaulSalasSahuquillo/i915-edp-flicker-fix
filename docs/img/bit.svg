<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-labelledby="t d">
<title id="t">One missing bit</title><desc id="d">All four lanes report lock (0x77) but bit 0 of DPCD byte 0x204, INTERLANE_ALIGN_DONE, is zero.</desc>
<defs><filter id="r3" x="-3%" y="-3%" width="106%" height="106%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="5" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/></filter></defs>
<style>
  .h{font:700 28px ui-rounded,'SF Pro Rounded','Nunito','Segoe UI',system-ui,-apple-system,sans-serif;fill:#4A3426}
  .t{font:600 17px ui-rounded,'SF Pro Rounded','Nunito','Segoe UI',system-ui,-apple-system,sans-serif;fill:#4A3426}
  .s{font:500 15px ui-rounded,'SF Pro Rounded','Nunito','Segoe UI',system-ui,-apple-system,sans-serif;fill:#7A5A44}
  .n{font:500 15px 'Segoe Print','Bradley Hand','Chalkboard SE','Ink Free','Marker Felt',ui-rounded,'Segoe UI',system-ui,sans-serif;fill:#7A5A44}
  .big{font:800 40px ui-rounded,'SF Pro Rounded','Nunito','Segoe UI',system-ui,-apple-system,sans-serif;fill:#4A3426}
  .stroke{fill:none;stroke:#4A3426;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}

  .lane{transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
  .l1{animation-delay:.1s}.l2{animation-delay:.35s}.l3{animation-delay:.6s}.l4{animation-delay:.85s}
  @keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
  .miss{animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{stroke-opacity:1;fill:#F3D3C4}50%{stroke-opacity:.35;fill:#FBF3E4}}
  .ptr{animation:nudge 2.4s ease-in-out infinite}
  @keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
</style>
