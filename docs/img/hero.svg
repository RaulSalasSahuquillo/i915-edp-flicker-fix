<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240" role="img" aria-labelledby="t d">
<title id="t">Screen flicker fix for i915 eDP panels</title><desc id="d">A laptop screen that blinks, with a hand-drawn underline below the project name.</desc>
<defs><filter id="r1" x="-3%" y="-3%" width="106%" height="106%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/></filter><radialGradient id="gl" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#F7D58E" stop-opacity=".95"/><stop offset="1" stop-color="#F7D58E" stop-opacity="0"/></radialGradient></defs>
<style>
  .h{font:700 28px ui-rounded,'SF Pro Rounded','Nunito','Segoe UI',system-ui,-apple-system,sans-serif;fill:#4A3426}
  .t{font:600 17px ui-rounded,'SF Pro Rounded','Nunito','Segoe UI',system-ui,-apple-system,sans-serif;fill:#4A3426}
  .s{font:500 15px ui-rounded,'SF Pro Rounded','Nunito','Segoe UI',system-ui,-apple-system,sans-serif;fill:#7A5A44}
  .n{font:500 15px 'Segoe Print','Bradley Hand','Chalkboard SE','Ink Free','Marker Felt',ui-rounded,'Segoe UI',system-ui,sans-serif;fill:#7A5A44}
  .big{font:800 40px ui-rounded,'SF Pro Rounded','Nunito','Segoe UI',system-ui,-apple-system,sans-serif;fill:#4A3426}
  .stroke{fill:none;stroke:#4A3426;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}

  .scr{animation:flick 13s infinite}
  @keyframes flick{0%{opacity:1}3%{opacity:.12}5%{opacity:1}8%{opacity:.2}10%{opacity:.95}13%{opacity:.08}16%{opacity:1}20%{opacity:.3}23%,100%{opacity:1}}
  .glow{animation:flick 13s infinite}
  .ul{stroke-dasharray:330;stroke-dashoffset:0;animation:draw 13s ease-out infinite}
  @keyframes draw{0%{stroke-dashoffset:330}16%,92%{stroke-dashoffset:0}100%{stroke-dashoffset:330}}
  .d1,.d2,.d3{animation:bob 6s ease-in-out infinite}.d2{animation-delay:-2s}.d3{animation-delay:-4s}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
</style>
<rect x="2" y="2" width="796" height="236" rx="26" fill="#FBF3E4"/>
<path d="M 28.6 2.2 L 771.4 2.0 Q 797.1 2.7 795.9 29.0 L 795.9 210.8 Q 796.0 236.0 770.8 237.8 L 28.1 236.3 Q 3.3 238.1 3.2 210.8 L 4.1 27.9 Q 3.9 2.5 28.1 2.1 Z" fill="none" stroke="#E6D2AE" stroke-width="2.5"/>

<circle class="glow" cx="170" cy="118" r="105" fill="url(#gl)"/>
<rect class="scr" x="84" y="58" width="172" height="106" rx="8" fill="#E8A33D"/>
<g filter="url(#r1)">
  <path class="stroke" d="M 87.6 47.6 L 252.4 44.5 Q 269.2 46.8 268.6 59.3 L 268.4 162.4 Q 268.3 174.8 253.8 175.6 L 86.8 177.8 Q 73.6 176.2 71.8 161.2 L 70.3 58.3 Q 71.9 45.3 85.6 47.4 Z" stroke-width="4"/>
  <path class="stroke" d="M 44 186 Q 170 200 296 186 L 288 176 L 52 176 Z" stroke-width="4" fill="#F2DFC0"/>
  <path class="stroke" d="M 150 190 Q 170 194 190 190" stroke-width="3"/>
</g>
<text x="340" y="112" class="h" style="font-size:36px">i915-edp-flicker-fix</text>
<path class="ul" d="M 340 128 q 30 -9 62 -2 t 62 0 t 62 1 t 62 -2 t 62 1" fill="none" stroke="#C65D3B" stroke-width="5" stroke-linecap="round"/>
<text x="340" y="164" class="s" style="font-size:18px">A one-bit fix for a screen that blinks</text>
<text x="340" y="196" class="n" style="font-size:14px">MSI Prestige 16Studio A13VF  ·  Ubuntu 26.04</text>
<circle class="d1" cx="748" cy="44" r="9" fill="#E8A33D"/><circle class="d2" cx="774" cy="78" r="6" fill="#C65D3B" opacity=".85"/><circle class="d3" cx="752" cy="206" r="5" fill="#D98A7A"/>

</svg>
